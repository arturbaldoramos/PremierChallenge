name: premiere_challenge

services:
  frontend:
    image: blamet/premiere-challenge-frontend:latest
    container_name: premiere_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - premiere_network
    restart: unless-stopped

  backend:
    image: blamet/premiere-challenge-backend:latest
    container_name: premiere_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=premiere_challenge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - premiere_network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: premiere_postgres
    environment:
      POSTGRES_DB: premiere_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - premiere_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: premiere_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - premiere_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  premiere_network:
    driver: bridge